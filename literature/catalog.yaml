# Bibliographic truth for the local library.
# One entry per paper. The agent takes bibliographic details ONLY from here.
#
# Fields
#   key       file stem in literature/md/<key>.md (lowercase, unique)
#   arxiv     arXiv identifier (string)
#   authors   short author string (first author et al.)
#   year      year of the journal version (or of the preprint)
#   venue     journal reference, or "preprint" / "submitted to ..."
#   doi       journal DOI, null if none / not checked
#   own       true if Sultan Abylkairov is a co-author
#   active    false = listed but not fetched or indexed
#   verified  true = arXiv ID, authors and venue checked against arXiv/ADS;
#             partial = arXiv record checked, venue details still to confirm
#   topic     one-line note on why the paper is in the library (not a title)
#
# Full titles and author lists are written into each Markdown file's front
# matter by src/fetch_arxiv.py from the arXiv API.
# Check catalog vs arXiv at any time:  python3 src/fetch_arxiv.py --check

